# =============================================================================
# Build and Release DevBridge CLI (GoReleaser)
#
# 触发:
#   pull_request       提 PR 时自动构建（验证代码能编译，不发布 Release）
#   workflow_dispatch  手动触发（构建 + 可选发布 Release）
#
# PR 触发:
#   自动运行，环境固定 test，goreleaser build --snapshot（只编译，不打包不发布）
#
# 手动触发:
#   inputs.version       版本号（留空则 git describe --tags --always）
#   inputs.env           环境 test/prod（默认 prod）
#   inputs.gitcode_token GitCode 个人访问令牌（留空则跳过 GitCode 上传）
#
# 发布逻辑:
#   PR 触发            → 仅编译验证，不发布
#   版本号包含 "release" → goreleaser release（发布 GitHub Release）+ 上传 GitCode Release
#   版本号不含 "release" → goreleaser release --skip=publish（构建打包存 artifact，不发布）
#
# Release 附件（GoReleaser 自动管理）:
#   devbridge_{OS}_{Arch}_{Version}[.exe].tar.gz   ×6 平台压缩包
#   checksums.txt                                    SHA256 校验汇总
#   install.sh / install.ps1                        版本与 Release 地址已内置
#
# 发布目标:
#   GitHub:  https://github.com/<repo>/releases/download/<Version>/install.sh
#   GitCode: https://gitcode.com/CloudDeveloperDepartment/devbrige/releases/<Version>
#
# 注意:
#   gitcode_token 通过 workflow input 传入（因仓库 Write 权限无法配 Secret）。
#   该值会出现在 workflow run 的 Inputs 面板中，有仓库 Read 权限的人可见。
#   如后续获得 Admin 权限，建议改用 repository secret 更安全。
# =============================================================================
name: Build CLI

on:
  pull_request:
    branches: [develop, main, master]
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（留空则用 git describe --tags --always）'
        required: false
        default: ''
      env:
        description: '环境'
        required: false
        default: 'prod'
        type: choice
        options: [test, prod]
      gitcode_token:
        description: 'GitCode 令牌（留空则跳过 GitCode 上传）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ---- 拉代码，fetch-depth: 0 让 git describe 拿到完整 tag 历史 ----
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ---- 解析版本号、环境、是否发布 ----
      - name: Resolve metadata
        id: meta
        run: |
          # 版本号：手动输入优先，否则 git describe
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="$(git describe --tags --always --dirty 2>/dev/null || echo dev)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "  版本号: $VERSION"

          # 环境：手动输入优先，PR 触发时 inputs.env 为空，默认 test
          ENV="${{ inputs.env }}"
          if [ -z "$ENV" ]; then
            ENV="test"
          fi
          echo "env=$ENV" >> "$GITHUB_OUTPUT"
          echo "  环境: $ENV"

          # 判断是否为 release 版本
          # PR 触发时强制不发布（即使版本号含 "release"，避免误发 Release）
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "is_pr=true" >> "$GITHUB_OUTPUT"
            echo "  发布 Release: 否（PR 触发，跳过发布）"
          elif echo "$VERSION" | grep -qi "release"; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "is_pr=false" >> "$GITHUB_OUTPUT"
            echo "  发布 Release: 是"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "is_pr=false" >> "$GITHUB_OUTPUT"
            echo "  发布 Release: 否（仅构建，不发布 Release）"
          fi

          # 选择 GoReleaser config
          if [ "$ENV" = "test" ]; then
            CONFIG=".goreleaser.test.yaml"
          else
            CONFIG=".goreleaser.yaml"
          fi
          echo "config=$CONFIG" >> "$GITHUB_OUTPUT"
          echo "  GoReleaser config: $CONFIG"

      # ---- 装 Go（go.mod 声明 1.26）----
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: cli/go.sum

      # ---- 装 GoReleaser ----
      - name: Setup GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          install-only: true

      # ---- 创建本地 tag（GoReleaser 依赖 tag 推导版本号）----
      # 非快照模式需要 tag；PR 快照模式不需要
      - name: Create local tag
        if: steps.meta.outputs.is_pr != 'true'
        working-directory: cli
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          git tag -f "${VERSION}" HEAD
          echo "已创建本地 tag: ${VERSION}"

      # ---- PR 触发：只编译验证，不打包不发布 ----
      - name: Build (PR snapshot)
        if: steps.meta.outputs.is_pr == 'true'
        working-directory: cli
        run: |
          goreleaser build --snapshot --clean --config ${{ steps.meta.outputs.config }}
          echo "✓ PR 编译验证通过"

      # ---- 手动触发，非 release 版本：构建 + 打包，不发布 ----
      - name: Build (no release)
        if: steps.meta.outputs.is_pr != 'true' && steps.meta.outputs.is_release != 'true'
        working-directory: cli
        run: |
          goreleaser release --clean --skip=publish \
            --config ${{ steps.meta.outputs.config }}

      # ---- 手动触发，release 版本：构建 + 发布 GitHub Release ----
      - name: Release
        if: steps.meta.outputs.is_release == 'true'
        working-directory: cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          goreleaser release --clean --config ${{ steps.meta.outputs.config }}

      # ---- 上传到 GitCode Release（release 版本 + 提供了 token 才执行）----
      # after.hooks 是 GoReleaser Pro 功能，OSS 版用 workflow 步骤替代
      - name: Upload to GitCode
        if: steps.meta.outputs.is_release == 'true' && inputs.gitcode_token != ''
        working-directory: cli
        env:
          GITCODE_TOKEN: ${{ inputs.gitcode_token }}
        run: |
          ./scripts/post-release.sh ${{ steps.meta.outputs.version }}

      # ---- 验证注入生效：跑一下 linux 产物，打印内嵌版本号 ----
      - name: Verify injected version
        if: steps.meta.outputs.is_pr != 'true'
        working-directory: cli
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          TARBALL="dist/devbridge_linux_amd64_${VERSION}.tar.gz"
          if [ ! -f "$TARBALL" ]; then
            echo "⚠️  tar.gz 不存在（可能是 snapshot 模式只编译不打包），跳过验证"
            exit 0
          fi
          mkdir -p /tmp/verify
          tar xzf "$TARBALL" -C /tmp/verify
          BIN="/tmp/verify/devbridge_linux_amd64_${VERSION}"
          echo "实际注入的版本号: $("$BIN" version)"
          [ "$("$BIN" version)" = "${VERSION}" ] || \
            { echo "❌ 版本号注入不匹配！"; exit 1; }
          rm -rf /tmp/verify

      # ---- 存 artifact（备份）----
      - name: Upload artifacts
        if: steps.meta.outputs.is_pr != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: devbridge-${{ steps.meta.outputs.version }}
          path: |
            cli/dist/devbridge_*.tar.gz
            cli/dist/checksums.txt
            cli/dist-extra/install.sh
            cli/dist-extra/install.ps1
          if-no-files-found: warn
