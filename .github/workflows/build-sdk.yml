# =============================================================================
# Build and release the DevBridge Go SDK.
#
# The SDK lives in ./go-sdk, so release tags MUST be go-sdk/vX.Y.Z (Go module
# proxy rule for subdirectory modules). On tag push the proxy indexes the
# version automatically; this workflow adds a source archive release on top:
#   - verifies the SDK builds cleanly (quality gates);
#   - publishes a GitHub Release (source tar.gz + checksums.txt) with
#     --latest=false, so it never steals releases/latest from the CLI;
#   - pushes the release tag to the GitCode mirror repo devbrige WITHOUT
#     creating a GitCode Release or uploading any artifact, so the CLI's rolling
#     latest and one-click install are never affected.
#
# Triggers:
#   pull_request          PR touching go-sdk/**
#   push (branches)       develop/master changes under go-sdk/**
#   push (tags go-sdk/v*) release tag -> CI + publish
#   workflow_dispatch     manual (input.version) -> CI + publish
#
# Notes:
#   - Tags are immutable once pushed (the module proxy caches them forever).
#   - Re-running a dispatch with an already-released version fails (422).
# =============================================================================
name: Build SDK

on:
  pull_request:
    branches: [develop, main, master]
    paths:
      - "go-sdk/**"
      - ".github/workflows/build-sdk.yml"
  push:
    branches: [develop, main, master]
    paths:
      - "go-sdk/**"
      - ".github/workflows/build-sdk.yml"
    tags:
      - "go-sdk/v*"
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（0.2.3 / 0.2.3-alpha，v 或 go-sdk/ 前缀可选；留空只跑 CI 不发布）'
        required: false
        default: ''
      gitcode_token:
        description: 'GitCode 令牌（留空则用仓库 secret，都没有则跳过 GitCode 上传）'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # CI quality gates; publishing is gated on these passing.
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go-sdk/go.mod
          cache-dependency-path: go-sdk/go.sum

      - name: Build
        working-directory: go-sdk
        run: go build ./...

      - name: Vet
        working-directory: go-sdk
        run: go vet ./...

      - name: Test
        working-directory: go-sdk
        run: go test ./...

  # ---------------------------------------------------------------------------
  # Package: resolve/validate the version and package the source archive.
  # ---------------------------------------------------------------------------
  package:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/go-sdk/') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve and validate version
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_VERSION="${{ inputs.version }}"
          else
            RAW_VERSION="${GITHUB_REF_NAME}"
          fi
          # Strip any go-sdk/ or sdk/ prefix: go-sdk/v0.2.1 -> v0.2.1
          NORMALIZED="$(printf '%s' "$RAW_VERSION" | sed -E 's#^(go-sdk|sdk)/##')"
          # Loose SemVer input: optional v, support 0.2.3 / 0.2.3-alpha / v0.2.0-rc.1
          if ! printf '%s' "$NORMALIZED" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::invalid version '$NORMALIZED' (must be SemVer, e.g. 0.2.3 / 0.2.3-alpha / v0.2.0-rc.1)"
            exit 1
          fi
          # Go module tags require the v prefix (go-sdk/vX.Y.Z).
          if ! printf '%s' "$NORMALIZED" | grep -q '^v'; then
            NORMALIZED="v${NORMALIZED}"
          fi
          echo "version=${NORMALIZED}" >> "$GITHUB_OUTPUT"
          echo "release_tag=go-sdk/${NORMALIZED}" >> "$GITHUB_OUTPUT"
          echo "  version: ${NORMALIZED}"
          echo "  release tag: go-sdk/${NORMALIZED}"

      - name: Package SDK source
        run: |
          mkdir -p dist
          git archive --format=tar.gz \
            --prefix="devbridge-go-sdk-${{ steps.resolve.outputs.version }}/" \
            --output="dist/devbridge-go-sdk-${{ steps.resolve.outputs.version }}.tar.gz" \
            HEAD:go-sdk
          (cd dist && sha256sum *.tar.gz > checksums.txt)
          ls -la dist

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: sdk-package-${{ steps.resolve.outputs.version }}
          path: dist/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Publish: GitHub Release with --latest=false (never steals CLI latest).
  # ---------------------------------------------------------------------------
  publish-github:
    runs-on: ubuntu-latest
    needs: package
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download package artifact
        uses: actions/download-artifact@v8
        with:
          name: sdk-package-${{ needs.package.outputs.version }}
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.package.outputs.version }}"
          TAG="${{ needs.package.outputs.release_tag }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="--target ${{ github.sha }}"
          else
            TARGET=""
          fi
          # Pre-release versions (-alpha/-beta/-rc.N) keep the prerelease flag;
          # stable versions are normal releases. Both pass --latest=false so the
          # CLI's releases/latest (install.sh) is never replaced.
          if printf '%s' "$VERSION" | grep -q -- '-'; then
            PRERELEASE_FLAG="--prerelease"
          else
            PRERELEASE_FLAG=""
          fi
          gh release create "${TAG}" \
            ${TARGET} \
            --title "devbridge-go-sdk ${VERSION}" \
            --generate-notes \
            ${PRERELEASE_FLAG} \
            --latest=false \
            "dist/devbridge-go-sdk-${VERSION}.tar.gz" \
            "dist/checksums.txt"
          echo "created GitHub Release ${TAG}"

  # ---------------------------------------------------------------------------
  # Mirror: push the release tag to the GitCode mirror repo (devbrige) WITHOUT
  # creating a GitCode Release or uploading any artifact, so the CLI's rolling
  # latest and one-click install are never affected.
  # ---------------------------------------------------------------------------
  sync-tag:
    runs-on: ubuntu-latest
    needs: package
    permissions:
      contents: read
    env:
      # Manual dispatch may pass the token via input; otherwise fall back to the
      # repository secret. Prefer the secret for real releases.
      GITCODE_TOKEN_SECRET: ${{ secrets.GITCODE_TOKEN }}
      GITCODE_TOKEN_INPUT: ${{ inputs.gitcode_token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Push tag to GitCode
        run: |
          TOKEN="${GITCODE_TOKEN_INPUT:-${GITCODE_TOKEN_SECRET:-}}"
          if [ -z "$TOKEN" ]; then
            echo "GITCODE_TOKEN not set, skipping tag sync"
            exit 0
          fi
          TAG="${{ needs.package.outputs.release_tag }}"
          git tag "${TAG}" HEAD
          git push "https://oauth2:${TOKEN}@gitcode.com/CloudDeveloperDepartment/devbrige.git" \
            "refs/tags/${TAG}:refs/tags/${TAG}"
          echo "synced tag ${TAG} to GitCode"