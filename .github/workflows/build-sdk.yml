# =============================================================================
# Build and release the DevBridge Go SDK.
#
# Release is a git tag (e.g. go-sdk/v0.1.0); the Go module proxy indexes it
# automatically. This workflow:
#   - verifies the SDK builds, vets, and tests cleanly;
#   - on a manual dispatch with a version, creates the tag on GitHub;
#   - mirrors the tag to the GitCode mirror repo devbrige.
#
# Triggers:
#   pull_request          PR touching go-sdk/**
#   push (branches)       develop/master changes under go-sdk/**
#   push (tags go-sdk/v*) SDK release tag (build + mirror to GitCode)
#   workflow_dispatch     manual (optional: create tag + mirror to GitCode)
#
# Notes:
#   - The SDK lives in a subdirectory; release tags must use the go-sdk/ prefix.
#   - Tags are immutable once pushed (the module proxy caches them forever).
#   - Requires the repo's Actions "Workflow permissions" to allow read/write
#     (needed for the GITHUB_TOKEN tag push).
#   - GitCode token comes from inputs.gitcode_token (manual) or
#     secrets.GITCODE_TOKEN; skipped when neither is set.
# =============================================================================
name: Build SDK

on:
  pull_request:
    branches: [develop, main, master]
    paths:
      - "go-sdk/**"
      - ".github/workflows/build-sdk.yml"
  push:
    branches: [develop, main, master]
    paths:
      - "go-sdk/**"
      - ".github/workflows/build-sdk.yml"
    tags:
      - "go-sdk/v*"
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 go-sdk/v0.1.0，留空则仅构建）'
        required: false
        default: ''
      gitcode_token:
        description: 'GitCode 令牌（留空则跳过 GitCode tag 同步）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Use the Go version declared in go.mod.
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go-sdk/go.mod
          cache-dependency-path: go-sdk/go.sum

      - name: Build
        working-directory: go-sdk
        run: go build ./...

      - name: Vet
        working-directory: go-sdk
        run: go vet ./...

      - name: Test
        working-directory: go-sdk
        run: go test ./...

  # Create the release tag on GitHub (manual dispatch only) and mirror it to
  # GitCode. On a tag push the tag already exists, so only the mirror step runs.
  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/go-sdk/') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      # Manual dispatch only: create the tag on GitHub. A tag pushed via
      # GITHUB_TOKEN does not re-trigger this workflow.
      - name: Create tag on GitHub
        if: github.event_name == 'workflow_dispatch'
        run: |
          git tag "${{ steps.tag.outputs.tag }}" HEAD
          git push origin "refs/tags/${{ steps.tag.outputs.tag }}"
          echo "created tag ${{ steps.tag.outputs.tag }} on GitHub"

      - name: Mirror tag to GitCode
        env:
          GITCODE_TOKEN_INPUT: ${{ inputs.gitcode_token }}
          GITCODE_TOKEN_SECRET: ${{ secrets.GITCODE_TOKEN }}
        run: |
          TOKEN="${GITCODE_TOKEN_INPUT:-${GITCODE_TOKEN_SECRET:-}}"
          if [ -z "$TOKEN" ]; then
            echo "GITCODE_TOKEN not set, skipping GitCode tag sync"
            exit 0
          fi
          TAG="${{ steps.tag.outputs.tag }}"
          git tag "${TAG}" HEAD
          git push "https://oauth2:${TOKEN}@gitcode.com/CloudDeveloperDepartment/devbrige.git" \
            "refs/tags/${TAG}:refs/tags/${TAG}"
          echo "synced tag ${TAG} to GitCode"