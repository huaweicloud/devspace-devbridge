# =============================================================================
# GoReleaser config — test environment
#
# Usage:
#   goreleaser build --snapshot --clean --config .goreleaser.test.yaml
#     → PR trigger: verify compilation only, no packaging or publishing
#
#   goreleaser release --clean --skip=publish --config .goreleaser.test.yaml
#     → manual trigger (non-release version): build + package + store to dist/, no publish
#
#   goreleaser release --clean --config .goreleaser.test.yaml
#     → manual trigger (release version): build + publish GitHub Release
#
# Differences from prod:
#   - only the 4 ldflags-injected test addresses differ
#   - release / before.hooks are identical (release versions need baked scripts)
#
# Note: after.hooks is a GoReleaser Pro feature, unsupported in the OSS build.
# GitCode upload is a separate workflow step (post-release.sh).
# =============================================================================
version: 2

project_name: devbridge

before:
  hooks:
    - go test ./...
    # Bake install scripts: inject version + GitHub Release URL
    - ./scripts/bake-install.sh {{ .Version }} "https://github.com/huaweicloud/devspace-devbridge/releases/download/{{ .Version }}"

builds:
  - id: devbridge
    main: ./cmd/cli
    binary: devbridge_{{ .Os }}_{{ .Arch }}_{{ .Version }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X huawei.com/devbridge/cmd.version={{ .Version }}
      - -X huawei.com/devbridge/internal/auth.LoginURL=https://devstation.ulanqab.huawei.com
      - -X huawei.com/devbridge/internal/config.DefaultServerDomain=https://100.85.118.163:8443
      - -X huawei.com/devbridge/internal/config.ServerAddr=100.85.117.75:443
      - -X huawei.com/devbridge/internal/config.ServerHost=devbridge-s2.hwtunnel.com
    flags:
      - -trimpath
    buildmode: pie

archives:
  - formats:
      - tar.gz
    # Align with install.sh: devbridge_{os}_{arch}_{version}[.exe].tar.gz
    # Note: no .tar.gz suffix here; GoReleaser appends it based on `formats`
    name_template: >-
      devbridge_{{ .Os }}_{{ .Arch }}_{{ .Version }}{{ if eq .Os "windows" }}.exe{{ end }}

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: git

release:
  github:
    owner: huaweicloud
    name: devspace-devbridge
  # Baked install scripts as extra release assets
  extra_files:
    - glob: ./dist-extra/install.sh
    - glob: ./dist-extra/install.ps1
  draft: false
  prerelease: false
  name_template: "cli-release-{{ .Version | replace \"-release\" \"\" }}"
