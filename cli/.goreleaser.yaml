# =============================================================================
# GoReleaser config — prod environment
#
# Usage:
#   goreleaser release --clean                     # derive version from git tag and publish
#   goreleaser release --clean --skip=publish      # build only (artifacts to dist/)
#
# Artifacts:
#   dist/devbridge_{os}_{arch}_{version}[.exe].tar.gz   ×6 platform archives
#   dist/checksums.txt                                  SHA256 checksums
#   dist-extra/install.sh / install.ps1                 baked install scripts
#
# Release assets (GitHub):
#   6 tar.gz + checksums.txt + install.sh + install.ps1
#
# Note: after.hooks is a GoReleaser Pro feature, unsupported in the OSS build.
# GitCode upload is a separate workflow step (post-release.sh).
# =============================================================================
version: 2

project_name: devbridge

before:
  hooks:
    - go test ./...
    # Bake install scripts: inject version + GitHub Release URL; OBS channel points at the flat dir
    - ./scripts/bake-install.sh {{ .Version }} "https://github.com/huaweicloud/devspace-devbridge/releases/download/{{ .Version }}" "https://tools-artifact.developer.huaweicloud.com/sharedata/devbridge"

builds:
  - id: devbridge
    main: ./cmd/cli
    binary: devbridge_{{ .Os }}_{{ .Arch }}_{{ .Version }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X huawei.com/devbridge/cmd.version={{ .Version }}
      - -X huawei.com/devbridge/internal/auth.LoginURL=https://devstation.connect.huaweicloud.com
      - -X huawei.com/devbridge/internal/config.DefaultServerDomain=https://bridge.developer.myhuaweicloud.com
      - -X huawei.com/devbridge/internal/config.ServerAddr=gateway.devbridge-s2.hwtunnel.com:443
      - -X huawei.com/devbridge/internal/config.ServerHost=devbridge-s2.hwtunnel.com
    flags:
      - -trimpath
    buildmode: pie

archives:
  - formats:
      - tar.gz
    # Align with install.sh: devbridge_{os}_{arch}_{version}[.exe].tar.gz
    # Note: no .tar.gz suffix here; GoReleaser appends it based on `formats`
    name_template: >-
      devbridge_{{ .Os }}_{{ .Arch }}_{{ .Version }}{{ if eq .Os "windows" }}.exe{{ end }}

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: git

release:
  github:
    owner: huaweicloud
    name: devspace-devbridge
  # Baked install scripts as extra release assets
  extra_files:
    - glob: ./dist-extra/install.sh
    - glob: ./dist-extra/install.ps1
  draft: false
  prerelease: false
  name_template: "cli-release-{{ .Version | replace \"-release\" \"\" }}"
